name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-package-lock
      - run: npm test
      - run: bash -n deploy/deploy.sh && bash -n deploy/deploy-dispatch.sh

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: smj-transfer-production
      cancel-in-progress: false
    steps:
      - name: Deploy tested commit and verify services
        env:
          DEPLOY_KEY: ${{ secrets.TRANSFER_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ vars.TRANSFER_DEPLOY_HOST }}
          KNOWN_HOSTS: ${{ vars.TRANSFER_DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          key_dir=$(mktemp -d)
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$key_dir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$key_dir/known_hosts"
          ssh -F /dev/null -T -i "$key_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$key_dir/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=20 -o ServerAliveCountMax=3 \
            "smj-transfer-deploy@$DEPLOY_HOST" "deploy $GITHUB_SHA"
